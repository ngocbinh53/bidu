<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💞 Vòng quay tình yêu + Lịch đi bệnh viện 💞</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #eef6ff, #f5f8ff 45%, #edf7ff);
      min-height: 100vh;
      color: #2d3748;
    }

    .app-shell {
      max-width: 1220px;
      margin: 0 auto;
      display: flex;
      min-height: 780px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 30px;
      box-shadow: 0 24px 60px rgba(59, 130, 246, 0.14);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, #0b3b8c 0%, #1353d6 100%);
      color: #fff;
      padding: 26px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 8px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.18);
      margin-bottom: 24px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255,255,255,0.18);
      display: grid;
      place-items: center;
      font-size: 1.4rem;
    }

    .brand-name {
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .brand-sub {
      display: block;
      font-size: 0.72rem;
      opacity: 0.8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .tab-bar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tab-button {
      border: none;
      border-radius: 16px;
      padding: 14px 16px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.08);
      color: #eaf3ff;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      transition: all 0.2s ease;
    }

    .tab-button:hover {
      background: rgba(255,255,255,0.12);
      transform: translateX(2px);
    }

    .tab-button.active {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
      color: white;
    }

    .tab-icon {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      background: rgba(255,255,255,0.15);
      display: grid;
      place-items: center;
      font-size: 1rem;
    }

    .sidebar-footer {
      padding-top: 18px;
      margin-top: 18px;
      border-top: 1px solid rgba(255,255,255,0.18);
      font-size: 0.78rem;
      opacity: 0.8;
      line-height: 1.5;
    }

    .main-panel {
      flex: 1;
      padding: 30px;
      background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(239,246,255,0.8));
    }

    .tab-panel {
      display: none;
      min-height: 730px;
    }

    .tab-panel.active {
      display: block;
    }

    .wheel-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 700px;
      position: relative;
    }

    .wheel-container {
      position: relative;
      width: 400px;
      height: 400px;
    }

    canvas#wheel {
      width: 400px;
      height: 400px;
      border-radius: 50%;
      border: 10px solid #fff;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.25);
      transition: transform 8s cubic-bezier(0.33, 1, 0.68, 1);
      background: radial-gradient(circle at center, #fffafc 0%, #f9d5ea 100%);
    }

    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.4em;
      color: #fff;
      text-shadow: 0 0 8px #ff69b4;
      cursor: pointer;
      user-select: none;
      text-align: center;
    }

    .pointer {
      position: absolute;
      right: -30px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 20px solid transparent;
      border-bottom: 20px solid transparent;
      border-left: 30px solid gold;
      filter: drop-shadow(0 0 5px #ffb400);
    }

    #result {
      margin-top: 30px;
      font-size: 1.6em;
      color: #ff1493;
      text-shadow: 0 0 10px white;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
      min-height: 90px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .schedule-card {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 26px;
      padding: 28px;
      box-shadow: 0 16px 40px rgba(37, 99, 235, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    .schedule-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .schedule-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      font-weight: 700;
      font-size: 0.88rem;
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.24);
    }

    .schedule-title {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.3rem);
      color: #173ea8;
    }

    .date-box {
      background: linear-gradient(135deg, #eef6ff, #e0ebff);
      border: 1px solid #bfd3ff;
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 22px;
    }

    .date-day {
      color: #1d4ed8;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.8rem;
      margin-bottom: 10px;
    }

    .date-main {
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      font-weight: 800;
      color: #1d4ed8;
      margin-bottom: 12px;
    }

    .date-location {
      font-size: 1.02rem;
      color: #374151;
      line-height: 1.6;
    }

    .date-location strong {
      color: #1e3a8a;
    }

    .schedule-list {
      background: #fff;
      border-radius: 18px;
      padding: 18px 20px;
      border: 1px solid #dbeafe;
      margin-bottom: 22px;
    }

    .schedule-list h3 {
      margin-top: 0;
      color: #1d4ed8;
      font-size: 1.1rem;
    }

    .schedule-list ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 12px;
    }

    .schedule-list li {
      background: #f8fbff;
      border-left: 5px solid #3b82f6;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: #334155;
    }

    .schedule-list .label {
      font-weight: 700;
      color: #1d4ed8;
    }

    .form-box {
      background: #f8fbff;
      border: 1px solid #dbeafe;
      border-radius: 18px;
      padding: 18px;
    }

    .form-box h3 {
      margin: 0 0 16px;
      color: #1d4ed8;
    }

    .schedule-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1e40af;
    }

    .field input {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #bfdbfe;
      background: white;
      font-size: 0.96rem;
      color: #333;
      outline: none;
    }

    .field input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
    }

    .submit-btn {
      justify-self: start;
      margin-top: 8px;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.24);
    }

    .heart {
      position: fixed;
      top: -10px;
      color: #ff69b4;
      font-size: 18px;
      animation: fall linear forwards;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.9;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh);
        opacity: 0;
      }
    }

    @media (max-width: 860px) {
      .app-shell {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
      }

      .tab-bar {
        flex-direction: row;
        flex-wrap: wrap;
      }
    }

    @media (max-width: 680px) {
      body {
        padding: 12px;
      }

      .main-panel {
        padding: 14px;
      }

      .wheel-container,
      canvas#wheel {
        width: 300px;
        height: 300px;
      }

      .schedule-card {
        padding: 18px;
      }

      .date-main {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div>
        <div class="brand">
          <div class="brand-mark">💙</div>
          <div>
            <div class="brand-name">Kim Dung</div>
            <span class="brand-sub">Care Panel</span>
          </div>
        </div>

        <nav class="tab-bar" aria-label="Menu chính">
          <button class="tab-button active" data-tab="wheel-tab">
            <span class="tab-icon">💞</span>
            Vòng quay
          </button>
          <button class="tab-button" data-tab="schedule-tab">
            <span class="tab-icon">🩺</span>
            KiDu
          </button>
        </nav>
      </div>

      <div class="sidebar-footer">
        Lịch hẹn &amp; thông tin chăm sóc
      </div>
    </aside>

    <main class="main-panel">
      <section id="wheel-tab" class="tab-panel active">
        <div class="wheel-wrap">
          <div class="wheel-container">
            <canvas id="wheel" width="400" height="400"></canvas>
            <div class="center-text" id="spinText">💘 Click để quay 💘</div>
            <div class="pointer"></div>
          </div>

          <div id="result"></div>
        </div>
      </section>

      <section id="schedule-tab" class="tab-panel">
        <div class="schedule-card">
          <div class="schedule-header">
            <span class="schedule-badge">🩺 KiDu</span>
            <h2 class="schedule-title">Lịch làm việc</h2>
          </div>

          <div class="date-box">
            <div class="date-day" id="dayLabel">Thứ</div>
            <div class="date-main" id="dateValue">Ngày tháng năm</div>
            <div class="date-location">
              <strong>Địa điểm:</strong>
              <span id="locationValue">Bệnh viện</span>
            </div>
          </div>

          <div class="schedule-list">
            <h3>Danh sách lịch</h3>
            <ul id="scheduleList"></ul>
          </div>

          <div class="form-box">
            <h3>Thêm lịch mới</h3>
            <form id="scheduleForm" class="schedule-form">
              <div class="field">
                <label for="labelInput">Label</label>
                <input id="labelInput" name="label" type="text" value="KiDu" required>
              </div>
              <div class="field">
                <label for="dayInput">Thứ</label>
                <input id="dayInput" name="day" type="text" placeholder="VD: Thứ Sáu" required>
              </div>
              <div class="field">
                <label for="dateInput">Ngày</label>
                <input id="dateInput" name="date" type="date" required>
              </div>
              <div class="field">
                <label for="locationInput">Địa điểm</label>
                <input id="locationInput" name="location" type="text" placeholder="VD: Bệnh viện Đại học Y Dược" required>
              </div>
              <button type="submit" class="submit-btn">Thêm lịch</button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </div>

  <audio autoplay loop>
    <source src="https://files.freemusicarchive.org/storage-freemusicarchive-org/music/no_curator/Arulo/Romantic/Love.mp3" type="audio/mpeg">
  </audio>

  <script>
    const gifts = ["Son", "Gấu bông", "Hoa", "Ăn lẩu", "Đi ăn ốc", "Đi ăn đồ nướng", "Túi xách", "Nước hoa", "Quần áo"];
    const colors = ["#ff99cc", "#ffc0cb", "#ffe4e1", "#ffb6d2", "#ff80b3", "#ff6699", "#ff4d88", "#ff3366", "#ff1a4d"];
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const radius = canvas.width / 2;
    const arc = (2 * Math.PI) / gifts.length;
    const resultEl = document.getElementById("result");
    const spinText = document.getElementById("spinText");
    let rotation = 0;
    let spinning = false;

    function drawWheel() {
      for (let i = 0; i < gifts.length; i++) {
        const angle = i * arc;
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, angle, angle + arc);
        ctx.fill();
        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 18px Arial";
        ctx.fillText(gifts[i], radius - 10, 10);
        ctx.restore();
      }
    }

    drawWheel();

    spinText.addEventListener("click", () => {
      if (spinning) return;
      spinning = true;
      resultEl.innerHTML = "";
      const spinAngle = 360 * 8 + Math.random() * 360;
      rotation += spinAngle;
      canvas.style.transform = `rotate(${rotation}deg)`;

      setTimeout(() => {
        const deg = rotation % 360;
        const index = Math.floor((gifts.length - deg / 360 * gifts.length) % gifts.length);
        const gift = gifts[index];
        resultEl.innerHTML = `💝 Chúc mừng Kim Dung! Bạn trúng <b>${gift}</b> 💝<br><span style="font-size:1.3em;">Anh yêu em hơn cả yêu 💗</span>`;
        spinning = false;
      }, 8000);
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "💗";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 3 + Math.random() * 4 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }
    setInterval(createHeart, 200);

    const STORAGE_KEY = "pinkClinicScheduleData";
    const defaultAppointments = [
      { id: 1, label: "KiDu", day: "Thứ Bảy", date: "2026-09-26", location: "Bệnh viện Đa khoa Hoàn Mỹ" },
      { id: 2, label: "KiDu", day: "Thứ Hai", date: "2026-09-28", location: "Bệnh viện Đại học Y Dược" }
    ];

    const dayLabel = document.getElementById("dayLabel");
    const dateValue = document.getElementById("dateValue");
    const locationValue = document.getElementById("locationValue");
    const scheduleList = document.getElementById("scheduleList");
    const scheduleForm = document.getElementById("scheduleForm");

    function loadAppointments() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (Array.isArray(saved) && saved.length) return saved;
      } catch (error) {
        console.error("Lỗi đọc localStorage:", error);
      }
      return defaultAppointments;
    }

    function saveAppointments(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function formatDate(dateString) {
      const date = new Date(dateString + "T00:00:00");
      if (Number.isNaN(date.getTime())) return dateString;
      return new Intl.DateTimeFormat("vi-VN", {
        weekday: "long",
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }).format(date);
    }

    function renderAppointments() {
      const items = loadAppointments();
      const newest = items[0] || defaultAppointments[0];
      const formatted = formatDate(newest.date);
      dayLabel.textContent = newest.day || "Thứ";
      dateValue.textContent = formatted;
      locationValue.textContent = newest.location || "Bệnh viện";

      scheduleList.innerHTML = items.map(item => `
        <li>
          <span><span class="label">${item.label}</span> · ${item.day}</span>
          <span>${formatDate(item.date)} · ${item.location}</span>
        </li>
      `).join("");
    }

    scheduleForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const formData = new FormData(scheduleForm);
      const newItem = {
        id: Date.now(),
        label: formData.get("label") || "KiDu",
        day: formData.get("day"),
        date: formData.get("date"),
        location: formData.get("location")
      };

      const current = loadAppointments();
      const updated = [newItem, ...current];
      saveAppointments(updated);
      renderAppointments();
      scheduleForm.reset();
      document.getElementById("labelInput").value = "KiDu";
    });

    document.querySelectorAll(".tab-button").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tab-button").forEach((item) => item.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach((panel) => panel.classList.remove("active"));
        button.classList.add("active");
        document.getElementById(button.dataset.tab).classList.add("active");
      });
    });

    renderAppointments();
  </script>
</body>
</html>
